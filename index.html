<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>curtain — animated typography</title>
  <link rel="stylesheet" href="shared/css/fonts.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; overscroll-behavior: none;
    /* Chakra Petch, self-hosted (shared/css/fonts.css) — the same face the
       curtain itself is set in, so the chrome and the work are one typography
       instead of a monospace UI parked on top of a piece. The monospace stack
       stays as the fallback. */
    font: 400 13px/1.5 "Chakra Petch", ui-monospace, "SF Mono", Menlo, monospace;
    color: #fff;
  }

  /* Each piece lives in its own iframe: its own module scope, its own canvas,
     its own physics loop. Nothing to reconcile between three pieces that were
     each written as the whole page. */
  #stage { position: fixed; inset: 0; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; display: none; opacity: 0;
    transition: opacity 340ms ease;
    /* A piece booting out of sight is display:block with opacity 0 — invisible,
       but it would still sit on top of the piece you ARE looking at and swallow
       every pointer move, which is the force the letters answer to. */
    pointer-events: none;
  }
  iframe.active { opacity: 1; pointer-events: auto; }

  /* ----- chrome. Deliberately faint: it sits on top of the work. ----- */
  .ui { position: fixed; z-index: 10; }

  .arrow {
    top: 50%; transform: translateY(-50%);
    width: 68px; height: 120px;
    display: grid; place-items: center;
    background: none; border: 0; cursor: pointer;
    color: #fff; opacity: 0.28;
    transition: opacity 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .arrow:hover, .arrow:focus-visible { opacity: 0.95; outline: none; }
  .arrow svg { width: 26px; height: 26px; filter: drop-shadow(0 0 6px rgba(0,0,0,0.9)); }
  #prev { left: 0; }
  #next { right: 0; }

  #label {
    left: 26px; bottom: 22px;
    display: flex; align-items: baseline; gap: 12px;
    text-shadow: 0 0 10px rgba(0,0,0,0.95);
    pointer-events: none;
  }
  #num { opacity: 0.8; font-variant-numeric: tabular-nums; }
  #name { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; }
  #desc { opacity: 0.85; }

  #dots {
    left: 50%; transform: translateX(-50%); bottom: 24px;
    display: flex; gap: 10px;
  }
  .dot {
    width: 7px; height: 7px; padding: 0;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.5);
    background: none; cursor: pointer;
    transition: background 180ms ease, transform 180ms ease;
  }
  .dot[aria-current="true"] { background: #fff; transform: scale(1.25); }

  #hint {
    /* Arriba y al centro. Es la única línea de la pantalla que puede quedarse
       indefinidamente — hasta que el audio arranque —, y abajo a la derecha se
       leía como pie de página de otra cosa. Entre el wordmark y los botones no
       hay nada, así que ahí no tapa nada. */
    top: 24px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: min(64vw, 460px);
    opacity: 0.88;
    pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,0.95);
    transition: opacity 600ms ease;
  }
  #hint.gone { opacity: 0; }

  /* ----- the wordmark. The only thing on this page that is not the work:
     whose work it is, and where to find more of it. ----- */
  #brand { left: 26px; top: 18px; }
  #mark {
    display: inline-flex; align-items: baseline; gap: 8px;
    color: #fff; text-decoration: none;
    /* No text-shadow, on purpose: the halo under it was reading as a smudge
       against the sky. Plain white at full opacity instead — the wordmark is not
       part of the faint chrome, it is the signature. */
    font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase;
    opacity: 1;
  }
  /* No underline on hover either: the wordmark is set once and does not need to
     perform being a link. The pointer and the tab focus ring are enough. */
  #mark:hover, #mark:focus-visible { outline: none; }
  /* La flecha es un trazo dibujado, no el glifo ↗ de la fuente: el glifo venía
     con el grosor y la punta que decidiera la tipografía, y a 19px se leía como
     un acento. Un SVG de una sola línea con punta, del mismo grosor que el
     hairline de la palabra. Medido sobre el render: la tinta del glifo viejo a
     19px daba 11x11 px; el SVG a 34px, ya girado -45°, da 17x17 — un 55% más
     de trazo visible. Ojo: al girar 45° el largo se proyecta dividido por √2,
     así que la caja del em tiene que ser bastante mayor que la tinta que se ve. */
  #mark em {
    display: inline-block; width: 34px; height: 34px;
    /* La caja del em es mayor que la tinta, así que el gap de 8px del flex se
       leía como 21px de aire. -5px lo devuelve a los 16px de antes. */
    margin-left: -5px;
    align-self: center; opacity: 0.85;
    /* En reposo apunta arriba a la derecha (salir del sitio); al pasar por
       encima se endereza a la horizontal. Se dibuja horizontal y se gira, así
       la punta nunca se deforma. */
    transform: rotate(-45deg);
    transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), opacity 180ms ease;
  }
  #mark em svg { width: 100%; height: 100%; display: block; }
  #mark:hover em, #mark:focus-visible em { transform: rotate(0deg); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #mark em { transition: none; } }
  /* ----- the play button, and the panel it opens ----- */
  /* Los dos botones de arriba a la derecha comparten fila. Van en un contenedor
     y no clavados en píxeles porque #play cambia de ancho al abrirse ("play" pasa
     a "close"), y el del sonido tendría que perseguirlo. */
  #topright { top: 20px; right: 22px; display: flex; align-items: center; gap: 9px; }

  #play {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 15px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.32);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff; font: inherit; font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    opacity: 0.92; transition: opacity 180ms ease, border-color 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #play:hover, #play:focus-visible { opacity: 1; border-color: rgba(255,255,255,0.6); outline: none; }
  #play[aria-expanded="true"] { opacity: 1; border-color: rgba(255,255,255,0.4); }
  #play svg { width: 10px; height: 10px; display: block; }
  #play .close { display: none; }
  #play[aria-expanded="true"] .close { display: block; }

  /* El interruptor de sonido: redondo, del mismo material que #play, sin palabra.
     Es lo primero que alguien busca apagar, así que no puede vivir dentro de un
     panel que hay que abrir. */
  #sound {
    flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(0,0,0,0.32);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff;
    opacity: 0.92; transition: opacity 180ms ease, border-color 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #sound:hover, #sound:focus-visible { opacity: 1; border-color: rgba(255,255,255,0.6); outline: none; }
  #sound svg { width: 15px; height: 15px; display: block; }
  /* Apagado se lee sin hover: cambia el icono Y baja la intensidad. */
  #sound[aria-pressed="false"] { opacity: 0.55; }
  #sound[aria-pressed="false"] .on { display: none; }
  #sound[aria-pressed="true"] .off { display: none; }

  #panel {
    top: 62px; right: 22px;
    width: min(336px, calc(100vw - 44px));
    /* Enough for the tallest state — nine controls plus the alphabet row — without
       clipping the footer. Still clear of the bottom chrome. */
    max-height: calc(100vh - 118px);
    overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 17px 14px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(8,8,10,0.76);
    -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity 200ms ease, transform 200ms ease, visibility 200ms;
  }
  #panel.open { opacity: 1; visibility: visible; transform: none; }
  #panel h2 {
    margin: 0; font-size: 12px; font-weight: 400;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  /* +0.5px and a touch more opacity than the monospace version: Chakra Petch has
     a smaller x-height, so the same 11px read noticeably fainter. */
  #panel p { margin: 8px 0 0; font-size: 11.5px; line-height: 1.62; opacity: 0.94; }
  #panel .lede { opacity: 1; }

  .tune-group { margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.09); padding-top: 12px; }
  .tune-group h3 {
    margin: 0; font-size: 10px; font-weight: 500; opacity: 1;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .tune-note { margin: 5px 0 2px !important; opacity: 0.82 !important; }
  .tune-row { margin-top: 11px; }
  .tune-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .tune-name { font-size: 12px; opacity: 1; }
  .tune-val { font-size: 11px; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .tune-inline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  /* Two columns for the swatches: the colour group is the one that costs the most
     height for the least ink, and 2x2 keeps "fuerza" above the fold. */
  .tune-group[data-group="color"] { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
  .tune-group[data-group="color"] h3,
  .tune-group[data-group="color"] .tune-note { grid-column: 1 / -1; }

  #panel input[type="range"] {
    width: 100%; margin: 5px 0 0; height: 14px;
    accent-color: #fff; background: none; cursor: ew-resize;
  }
  #panel input[type="color"] {
    width: 42px; height: 21px; padding: 0; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.28); border-radius: 4px;
    background: none; -webkit-appearance: none; appearance: none;
  }
  #panel input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  #panel input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 3px; }
  #panel input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: #fff; cursor: pointer; }
  #panel input[type="text"] {
    width: 100%; margin: 6px 0 0; padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 6px;
    background: rgba(255,255,255,0.06); color: #fff;
    font: inherit; font-size: 11px; letter-spacing: 0.06em;
  }
  #panel input[type="text"]:focus { outline: none; border-color: rgba(255,255,255,0.42); }
  #panel select {
    /* The native arrow is drawn in the OS's own light chrome on a dark panel, so
       the control is stripped and given the caret as a background glyph instead. */
    -webkit-appearance: none; appearance: none;
    padding: 5px 26px 5px 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06) no-repeat right 8px center;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%),
                      linear-gradient(135deg, #fff 50%, transparent 50%);
    background-size: 5px 5px, 5px 5px;
    background-position: right 13px center, right 9px center;
    background-repeat: no-repeat;
    color: #fff; font: inherit; font-size: 11px; letter-spacing: 0.04em;
  }
  #panel select:focus { outline: none; border-color: rgba(255,255,255,0.5); }
  #panel option { background: #0b0b0d; color: #fff; }

  #tune-foot {
    margin-top: 18px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.09);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  #reset {
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22); background: none; color: #fff;
    font: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    opacity: 0.92; transition: opacity 180ms ease, border-color 180ms ease;
  }
  #reset:hover, #reset:focus-visible { opacity: 1; border-color: rgba(255,255,255,0.6); outline: none; }
  #tune-foot span { font-size: 10px; opacity: 0.7; }

  #loading {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none; letter-spacing: 0.2em;
    transition: opacity 200ms ease;
  }
  #loading.on { opacity: 0.9; }

  @media (prefers-reduced-motion: reduce) {
    iframe, #hint, #loading, #panel { transition: none; }
  }
  @media (max-width: 640px) {
    .arrow { width: 48px; }
    #desc { display: none; }
    /* Keyboard hints on a touch screen name three things that are not there, and
       at this width they landed on top of the piece label. The swipe, the arrows
       and the play button are all discoverable without them. */
    #hint { display: none; }
    /* The word STAYS at this width. It used to be hidden in favour of the play
       triangle; with the triangle gone (it read as a transport control) hiding the
       word left an empty pill — nothing at all in the closed state. */
    #play { padding: 8px 13px; }
    #sound { width: 32px; height: 32px; }
    #panel { top: 58px; left: 16px; right: 16px; width: auto; max-height: calc(100vh - 150px); }
  }
</style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>

<div id="stage"></div>

<button class="ui arrow" id="prev" aria-label="Previous piece">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button class="ui arrow" id="next" aria-label="Next piece">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>

<header class="ui" id="brand">
  <a id="mark" href="https://www.instagram.com/filamento____/?hl=en"
     target="_blank" rel="noopener noreferrer"
     title="filamento on Instagram"><span>filamento</span><em aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></em></a>
</header>

<div class="ui" id="topright">

<button id="sound" type="button" aria-pressed="true"
        title="Sound on and off (S) — the bed and the curtain, both.">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/>
    <path d="M16.2 8.8a4.6 4.6 0 0 1 0 6.4"/>
    <path d="M18.9 6.3a8.4 8.4 0 0 1 0 11.4"/>
  </svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/>
    <path d="M16.4 9.6l5.2 4.8M21.6 9.6l-5.2 4.8"/>
  </svg>
</button>

<button id="play" type="button" aria-expanded="false" aria-controls="panel"
        title="Move the forces and colours of the piece (P)">
  <!-- No play triangle. It read as "press play on something" — a transport
       control for a clip, which is not what this opens. The word carries it. -->
  <svg class="close" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
  <span class="pword">play</span>
</button>

</div>

<div class="ui" id="panel" role="dialog" aria-label="Play with the piece">
  <h2>Play</h2>
  <!-- The claim has to match what the panel actually hands over. It used to
       promise "move a number" while four force sliders were here; with those gone
       it says what is left: the light and the words. -->
  <p class="lede">
    None of these letters is drawn. Each one hangs off a physics of weight, wind,
    current and light, and the shape falls out of that. What you get to change
    here is how it burns and what it says.
  </p>
  <div id="tune-body"></div>
  <div id="tune-foot">
    <button id="reset" type="button">back to the original</button>
    <span>P opens and closes</span>
  </div>
</div>

<div class="ui" id="label">
  <span id="num"></span><span id="name"></span><span id="desc"></span>
</div>
<div class="ui" id="dots"></div>
<div class="ui" id="hint">click for sound</div>
<div class="ui" id="loading">LOADING</div>

<script>
const PIECES = [
  { slug: "horse",  src: "horse/",  name: "Horse", desc: "a mane of letters" },
  // Ocultos por ahora — para reactivar cualquiera, descomentar su línea y
  // ubicarla donde corresponda en el orden. Nada más que hacer: el shell se
  // adapta solo (ver el guard de una sola pieza más abajo).
  // { slug: "fish",   src: "fish/",   name: "Fish",  desc: "code fins · water forces" },
  // { slug: "willow", src: "willow/", name: "Willow", desc: "vines hanging off the branches" },
];

// Con una sola pieza no hay a dónde pasar: las flechas, los puntos y el número
// del pager son controles muertos, y la pista mentiría. Se apagan aquí en vez
// de tocarse a mano cada vez que se comenta o descomenta una pieza de arriba.
const SOLO = PIECES.length < 2;

const stage = document.getElementById("stage");
const elNum = document.getElementById("num");
const elName = document.getElementById("name");
const elDesc = document.getElementById("desc");
const elDots = document.getElementById("dots");
const elHint = document.getElementById("hint");
const elLoading = document.getElementById("loading");

const elPlay = document.getElementById("play");
const elSound = document.getElementById("sound");
const elPanel = document.getElementById("panel");
const elTuneBody = document.getElementById("tune-body");

const frames = new Array(PIECES.length).fill(null);
const ready = new Array(PIECES.length).fill(false); // has posted "curtain:ready"
let index = -1;

// A piece that has not said "curtain:ready" has no letters yet, so it is NEVER
// faded in — the previous piece stays on screen instead. Fallback in case a
// piece dies before it can say anything: after this long we show it anyway,
// because a stuck shell is worse than a bare background.
const READY_FALLBACK_MS = 12000;

// Built once per piece and then kept. Returning to a piece finds it exactly as
// it was left instead of paying for a rebuild — willow alone is 2917 strands and
// 20211 particles.
//
// A booting frame is display:block with opacity 0: invisible, but its rAF runs,
// which is what lets it build, settle and paint out of sight. It only drops to
// display:none once it is ready and not the piece on screen.
function ensureFrame(i) {
  if (frames[i]) return frames[i];
  const p = PIECES[i];
  const f = document.createElement("iframe");
  f.src = p.src;
  f.title = p.name;
  f.setAttribute("scrolling", "no");
  f.setAttribute("allow", "autoplay");
  f.dataset.slug = p.slug;
  f.style.display = "block";
  f.addEventListener("load", () => {
    // Same origin (everything is served off one localhost), so the shell can put
    // its own key handler inside the piece too. Without this, one click on a
    // piece moves focus into its document and the arrow keys stop working — the
    // parent never sees them.
    try {
      f.contentWindow.addEventListener("keydown", onKey);
    } catch (err) {
      console.warn("No pude escuchar teclas dentro de", p.slug, "— usa las flechas de pantalla.", err);
    }
    setTimeout(() => {
      if (!ready[i]) {
        console.warn(`${p.slug} no dijo "curtain:ready" en ${READY_FALLBACK_MS}ms; la muestro igual.`);
        markReady(i);
      }
    }, READY_FALLBACK_MS);
  });
  frames[i] = f;
  stage.appendChild(f);
  return f;
}

// A string is the common case ("curtain:hide"); the tuning channel needs to send
// a payload with it, so an object goes through untouched.
const post = (f, msg) => {
  try {
    f.contentWindow?.postMessage(typeof msg === "string" ? { type: msg } : msg, "*");
  } catch (_) {
    /* the piece may not have booted far enough to listen; harmless */
  }
};

function setLoading(on) {
  elLoading.classList.toggle("on", on);
}

// One at a time, and only once the piece on screen is up: three simultaneous
// boots (two videos, ~2900 strands, three JSON fetches) would slow down the one
// piece the viewer is actually waiting for.
function preloadNext() {
  if (!ready[index]) return;
  const next = frames.findIndex((f) => f === null);
  if (next >= 0 && frames.every((f, i) => f === null || ready[i])) ensureFrame(next);
}

function markReady(i) {
  if (ready[i]) return;
  ready[i] = true;
  if (i === index) reveal();
  else park(i);
  preloadNext();
}

// `display:none` only stops the compositing. It does NOT stop the piece: Chrome
// kept firing rAF 19 times/s inside a hidden iframe (measured 2026-08-12), and
// one prefetched willow left solving behind another piece cost the visible one
// 30.7 -> 18.6 fps. "curtain:hide" is what actually parks it — the message is the
// load-bearing line here, the style change is the cosmetic one.
function park(i) {
  const f = frames[i];
  if (!f || i === index) return;
  post(f, "curtain:hide");
  f.classList.remove("active");
  f.style.display = "none";
}

// The crossfade only ever starts here, i.e. only once the incoming piece has
// letters painted. The outgoing piece holds the screen until then.
function reveal() {
  const f = frames[index];
  if (!f || !ready[index]) {
    setLoading(true);
    return;
  }
  setLoading(false);
  f.style.display = "block";
  post(f, "curtain:show");
  void f.offsetWidth; // commit the display change so the fade actually runs
  f.classList.add("active");

  frames.forEach((g, j) => {
    if (j === index || !g || !g.classList.contains("active")) return;
    g.classList.remove("active");
    post(g, "curtain:hide");
    setTimeout(() => {
      if (index !== j) g.style.display = "none";
    }, 360);
  });
}

// ---------------------------------------------------------------------------
//  THE PANEL — a visitor's dozen knobs over whichever piece is on screen.
//
//  The shell knows NOTHING about what it is drawing. Each piece declares its own
//  list of controls (horse/js/tune.js, fish/js/tune.js) and posts it over
//  "curtain:tune"; everything here is generic — label, kind, range, value. That is
//  why the horse's "viento" and the fish's "corriente" can be the same slider code
//  pointing at two unrelated parameters, and why adding a knob to a piece needs no
//  change to this file. See shared/js/tune.js for the protocol.
//
//  The spec objects are also where the shell REMEMBERS what the visitor did: each
//  entry's `value` is updated as it is sent, so leaving a piece and coming back
//  shows the piece as they left it rather than as the file wrote it.
// ---------------------------------------------------------------------------
const tuneSpecs = new Array(PIECES.length).fill(null);
let panelOpen = false;

// One line per group, editorial rather than technical: the panel has to say WHY
// these particular numbers are the ones on offer. Written here and not in the
// pieces because it is the same claim about all three of them.
// The pieces no longer offer a "force" group — see the note in horse/js/tune.js on
// why the physics was taken out of the visitor's panel. Nothing here had to change
// for that: the shell renders whatever groups it is handed.
const GROUP_NOTES = {
  color: "Every letter is baked in three layers: halo, body, core.",
  type: "The type and its light. Changing the text rebuilds the whole piece.",
  // Sin nota para "sound": ese grupo ya no se dibuja aquí (ver isSoundCtl).
};

// EL SONIDO ES EL ÚNICO CONTROL QUE NO SE DIBUJA EN EL PANEL. Sigue siendo un
// control de la pieza y viaja por el mismo protocolo (horse/js/tune.js, id
// "sound/sound"); el shell solo lo saca de la lista y le da el botón redondo de
// arriba, al lado de play. Razón: apagar el sonido es lo primero que alguien
// quiere hacer, y no se le puede pedir que abra un panel para llegar ahí.
const isSoundCtl = (c) => c.group === "sound";
const soundCtl = () =>
  (tuneSpecs[index] || []).find((c) => c.kind === "bool" && isSoundCtl(c)) || null;

// ESTE BOTÓN ES UN MUTE MAESTRO, y de ahí que el estado viva AQUÍ y no en la
// pieza. Suenan DOS cosas a la vez y solo una es de la pieza:
//   - el lecho ambiente (shared/js/ambient.js) es de este documento — una copia
//     por iframe serían tres cintas en tres puntos distintos, ver la nota larga
//     junto al <script type="module"> del final;
//   - el sonido de contacto (interactionSound.js) es de la pieza, y viaja por el
//     protocolo de tune.
// Mandarlo solo a la pieza era el bug: medido, "sound/sound" SÍ pasaba a false
// dentro del iframe, y la música seguía sonando igual — así que desde fuera el
// botón "no hacía nada". Nadie llamaba nunca a setAmbientEnabled.
let soundOn = true;
window.__soundOn = soundOn; // lo lee el módulo del ambiente, que carga después

// Se llama al pulsar, al cambiar de pieza y cuando una pieza anuncia (o reanuncia,
// tras un reset) sus controles. Empuja el estado del shell hacia los dos lados en
// vez de leerlo de ninguno: así el mute sobrevive un cambio de escena y un "back
// to the original", que es lo que espera quien apagó el sonido a propósito.
function syncSound() {
  window.__soundOn = soundOn;
  window.__setAmbient?.(soundOn); // no existe hasta que ambient.js carga
  const c = soundCtl();
  if (c && !!c.value !== soundOn) sendTune(c, soundOn);
  elSound.setAttribute("aria-pressed", String(soundOn));
  elSound.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
}

// Decimals enough for the step, so 0.005 reads as 0.145 and 2 reads as 114.
const decimalsFor = (step) => {
  const s = String(step ?? 0.01);
  const dot = s.indexOf(".");
  return dot < 0 ? 0 : s.length - dot - 1;
};

function sendTune(c, value) {
  c.value = value;
  const f = frames[index];
  if (f) post(f, { type: "curtain:tune-set", id: c.id, value });
}

function tuneRow(c) {
  const row = document.createElement("div");
  row.className = "tune-row";
  if (c.hint) row.title = c.hint;

  const name = document.createElement("span");
  name.className = "tune-name";
  name.textContent = c.label;

  if (c.kind === "number") {
    const head = document.createElement("div");
    head.className = "tune-head";
    const val = document.createElement("span");
    val.className = "tune-val";
    const d = decimalsFor(c.step);
    val.textContent = Number(c.value).toFixed(d);
    head.append(name, val);

    const input = document.createElement("input");
    input.type = "range";
    input.min = c.min;
    input.max = c.max;
    input.step = c.step ?? 0.01;
    input.value = c.value;
    input.setAttribute("aria-label", c.label);
    input.addEventListener("input", () => {
      const v = Number(input.value);
      val.textContent = v.toFixed(d);
      sendTune(c, v);
    });
    row.append(head, input);
    return row;
  }

  if (c.kind === "text" || c.kind === "words") {
    row.append(name);
    const input = document.createElement("input");
    input.type = "text";
    input.value = c.value;
    input.spellcheck = false;
    input.setAttribute("aria-label", c.label);
    // Debounced, because every keystroke here is a REBUILD of the whole piece
    // (the characters are handed out while the strands are built). "change" alone
    // would only fire on blur, which reads as the field being broken.
    let timer = null;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => sendTune(c, input.value), 420);
    });
    input.addEventListener("change", () => {
      clearTimeout(timer);
      sendTune(c, input.value);
    });
    row.append(input);
    return row;
  }

  if (c.kind === "choice") {
    const line = document.createElement("label");
    line.className = "tune-row tune-inline";
    if (c.hint) line.title = c.hint;
    const select = document.createElement("select");
    for (const opt of c.options || []) {
      const o = document.createElement("option");
      o.value = o.textContent = opt;
      if (opt === c.value) o.selected = true;
      select.appendChild(o);
    }
    select.addEventListener("change", () => sendTune(c, select.value));
    line.append(name, select);
    return line;
  }

  // color and bool: the control sits on the same line as its name.
  const line = document.createElement("label");
  line.className = "tune-row tune-inline";
  if (c.hint) line.title = c.hint;
  const input = document.createElement("input");
  if (c.kind === "color") {
    input.type = "color";
    input.value = c.value;
    input.addEventListener("input", () => sendTune(c, input.value));
  } else {
    input.type = "checkbox";
    input.checked = !!c.value;
    input.addEventListener("change", () => sendTune(c, input.checked));
  }
  line.append(name, input);
  return line;
}

function renderTune() {
  const spec = tuneSpecs[index];
  // A piece re-announces after a preset change (see shared/js/tune.js), which lands
  // here as a full rebuild of the rows. Without this the panel jumps back to the top
  // under the hand of whoever just used a control near the bottom.
  const scroll = elPanel.scrollTop;
  elTuneBody.textContent = "";

  if (!spec) {
    const p = document.createElement("p");
    p.textContent = "This piece is still building its controls.";
    elTuneBody.appendChild(p);
    return;
  }

  let section = null;
  for (const c of spec) {
    if (isSoundCtl(c)) continue; // vive en la barra de arriba, no aquí
    if (!section || section.dataset.group !== c.group) {
      section = document.createElement("section");
      section.className = "tune-group";
      section.dataset.group = c.group;
      const h = document.createElement("h3");
      h.textContent = c.group;
      section.appendChild(h);
      if (GROUP_NOTES[c.group]) {
        const note = document.createElement("p");
        note.className = "tune-note";
        note.textContent = GROUP_NOTES[c.group];
        section.appendChild(note);
      }
      elTuneBody.appendChild(section);
    }
    section.appendChild(tuneRow(c));
  }
  elPanel.scrollTop = scroll;
}

function setPanel(open) {
  panelOpen = open;
  elPanel.classList.toggle("open", open);
  elPlay.setAttribute("aria-expanded", String(open));
  elPlay.querySelector(".pword").textContent = open ? "close" : "play";
  if (open) renderTune();
}

elPlay.addEventListener("click", () => { setPanel(!panelOpen); hideHint(); });

elSound.addEventListener("click", () => {
  soundOn = !soundOn;
  syncSound();
  // Apagar el sonido a mano contesta la pregunta que hace "click for sound", así
  // que la línea se va: dejarla puesta sería insistir con algo ya decidido.
  hideHint();
});
document.getElementById("reset").addEventListener("click", () => {
  const f = frames[index];
  // The piece restores its own authored values and RE-ANNOUNCES the spec, which
  // is what redraws the inputs. The panel never guesses what "original" means.
  if (f) post(f, "curtain:tune-reset");
});

function show(i, { push = true } = {}) {
  if (i === index) return;
  index = ((i % PIECES.length) + PIECES.length) % PIECES.length;
  const p = PIECES[index];
  ensureFrame(index);
  reveal(); // no-op until the piece says it has letters

  elNum.textContent = String(index + 1).padStart(2, "0");
  elName.textContent = p.name;
  elDesc.textContent = p.desc;
  for (const d of elDots.children) {
    d.setAttribute("aria-current", String(Number(d.dataset.i) === index));
  }
  syncSound(); // el botón sigue a la pieza que se está mirando
  if (push) history.replaceState(null, "", "#" + p.slug);
  document.title = `${p.name} — curtain`;
  // An open panel follows the piece: different piece, different forces.
  if (panelOpen) renderTune();
}

window.addEventListener("message", (e) => {
  const type = e.data?.type;
  // El primer gesto dentro de una pieza (shared/js/stage.js). No hace falta
  // saber de qué pieza vino: el cartel es uno solo.
  if (type === "curtain:press") return hideHint();
  if (type !== "curtain:ready" && type !== "curtain:tune") return;
  const i = frames.findIndex((f) => f && f.contentWindow === e.source);
  if (i < 0) return;
  if (type === "curtain:ready") return markReady(i);
  // A piece offering (or re-offering, after a reset) its controls.
  tuneSpecs[i] = Array.isArray(e.data.spec) ? e.data.spec : null;
  if (i === index) syncSound();
  if (i === index && panelOpen) renderTune();
});

const go = (delta) => show(index + delta);

// Installed on the shell AND inside each piece (see ensureFrame), so it fires
// wherever the focus happens to be.
const isTypingTarget = (el) =>
  !!el &&
  (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Before the typing guard: a slider or a text field is exactly where you want
  // Escape to still close the panel.
  if (e.key === "Escape" && panelOpen) { setPanel(false); e.preventDefault(); return; }
  // A focused range input answers the arrow keys itself, and a text field owns
  // every key it gets. Paging the scene out from under either one is a bug.
  if (isTypingTarget(e.target)) return;
  if (e.key === "p" || e.key === "P") { setPanel(!panelOpen); hideHint(); }
  else if (e.key === "s" || e.key === "S") { elSound.click(); }
  else if (e.key === "ArrowRight") { go(1); hideHint(); }
  else if (e.key === "ArrowLeft") { go(-1); hideHint(); }
  else if (e.key >= "1" && e.key <= String(PIECES.length)) { show(Number(e.key) - 1); hideHint(); }
  else return;
  e.preventDefault();
}

function hideHint() {
  elHint.classList.add("gone");
}

PIECES.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "dot";
  b.dataset.i = i;
  b.type = "button";
  b.setAttribute("aria-label", p.name);
  b.addEventListener("click", () => { show(i); hideHint(); });
  elDots.appendChild(b);
});

if (SOLO) {
  for (const id of ["prev", "next", "dots"]) document.getElementById(id).style.display = "none";
  elNum.style.display = "none";
  // El nombre de la pieza también se va: con una sola en pantalla, decir cuál es
  // no informa de nada. Queda la línea de abajo sola, que es una leyenda de foto.
  elName.style.display = "none";
  // Y entonces tiene que sobrevivir al media query de 640px, que la esconde por
  // no chocar con el nombre. Sin nombre no hay choque, y esconderla dejaría la
  // esquina vacía en móvil.
  elDesc.style.display = "inline";
  // El cartel ya dice lo único que hay que decir; nada que recortar aquí.
}

document.getElementById("prev").addEventListener("click", () => { go(-1); hideHint(); });
document.getElementById("next").addEventListener("click", () => { go(1); hideHint(); });
window.addEventListener("keydown", onKey);

// Touch: a horizontal swipe past 50px pages, and only if it is clearly more
// horizontal than vertical, so a scroll gesture isn't read as a page turn.
let tx = 0, ty = 0;
window.addEventListener("touchstart", (e) => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
window.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) { go(dx < 0 ? 1 : -1); hideHint(); }
}, { passive: true });

window.addEventListener("hashchange", () => {
  const i = PIECES.findIndex((p) => p.slug === location.hash.slice(1));
  if (i >= 0) show(i, { push: false });
});

// A piece cannot make a sound until this page has had a real press. That is a
// browser rule and not a choice — moving the pointer does not count as one, only
// a click, a key or a touch does (the long note in shared/js/interactionSound.js
// has the measurements). So a visitor who lands here and only hovers the curtain
// gets silence, with nothing to tell them why, and it reads as broken rather
// than as waiting. De ahí el cartel, y de ahí que no se vaya con un temporizador:
// se va con el gesto que resuelve lo que el cartel pide.

// El cartel se va con el gesto, no con el reloj. Antes esperaba a oír que el
// audio ya sonaba, y eso llegaba tarde por construcción: la pieza tapa el
// viewport, así que el clic cae en el iframe y el shell se enteraba por el
// sondeo de shared/js/ambient.js — hasta 500 ms de retraso más 400 del suyo.
// Ahora la pieza avisa ("curtain:press", arriba) y aquí solo se escucha lo que
// caiga en el propio shell.
for (const type of ["pointerdown", "keydown", "touchstart", "wheel"]) {
  window.addEventListener(type, hideHint, { passive: true, capture: true });
}

// Deep link: /#willow opens on the willow.
const start = PIECES.findIndex((p) => p.slug === location.hash.slice(1));
show(start >= 0 ? start : 0);
</script>

<!-- The bed that runs under everything, for as long as the page is open. It is
     loaded here and not inside a piece on purpose: each piece is an iframe with
     its own AudioContext, so a bed started in one would be a different bed per
     piece, each at its own point in the recording, and every scene change would
     jump the tape. The shell owns it — one instance, started once, untouched by
     switching pieces. See the long note at the top of shared/js/ambient.js. -->
<script type="module">
  import { ambientRunning, setAmbientEnabled } from "./shared/js/ambient.js";
  window.__ambientRunning = ambientRunning;
  window.__setAmbient = setAmbientEnabled;
  // Este módulo carga DESPUÉS del script de arriba, así que a estas alturas el
  // botón ya puede estar en apagado. Se lee el estado, no se asume que es el
  // de fábrica: si no, el lecho arrancaría por encima de un mute.
  setAmbientEnabled(window.__soundOn !== false);
</script>
</body>
</html>
